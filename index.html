<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOY Candy PRO</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(180deg,#020617,#0f172a);
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* HUD */
.hud {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(15px);
    border-radius:20px;
    padding:10px;
}

/* GRID */
#game-grid {
    display:grid;
    grid-template-columns: repeat(8,1fr);
    gap:6px;
}

/* BLOCO */
.block {
    width:100%;
    aspect-ratio:1/1;
    border-radius:12px;
    transition:0.2s;
    box-shadow: inset 0 0 10px rgba(255,255,255,0.2);
}

.block:active {
    transform: scale(0.8);
}

/* EFEITO POP */
.pop {
    animation: pop 0.3s ease;
}

@keyframes pop {
    0% {transform: scale(1);}
    50% {transform: scale(1.3);}
    100% {transform: scale(0);}
}

/* BOTÃO */
.btn-main {
    background: linear-gradient(135deg,#22c55e,#4ade80);
    color:#000;
    padding:15px 25px;
    border-radius:50px;
    font-weight:bold;
    box-shadow:0 0 20px rgba(34,197,94,0.5);
}
</style>
</head>

<body>

<!-- HUD -->
<div class="w-full max-w-md flex justify-around mt-6 px-3">
    <div class="hud text-center">
        <div class="text-xs text-gray-400">MOEDAS</div>
        <div id="coins" class="text-lg font-bold text-yellow-400">0</div>
    </div>

    <div class="hud text-center">
        <div class="text-xs text-gray-400">MOVES</div>
        <div id="moves" class="text-xl font-bold">15</div>
    </div>

    <div class="hud text-center">
        <div class="text-xs text-gray-400">VIDAS</div>
        <div id="lives">❤️❤️❤️</div>
    </div>
</div>

<h2 class="mt-4 text-cyan-400 font-bold">NOY CANDY PRO</h2>

<!-- GAME -->
<div class="mt-4 p-3 bg-gray-900 rounded-2xl shadow-lg">
    <div id="game-grid" style="width:90vw; max-width:380px;"></div>
</div>

<!-- BOTÃO -->
<div class="mt-6">
    <button onclick="restart()" class="btn-main">JOGAR NOVAMENTE</button>
</div>

<script>
const grid = document.getElementById('game-grid');

let moves = 15;
let coins = 0;
let lives = 3;

const colors = ['#ff4b4b','#00d2ff','#00ff95','#ffcc00','#ad00ff'];

function init(){
    grid.innerHTML = '';
    for(let i=0;i<64;i++){
        const div = document.createElement('div');
        div.className='block';

        let color = randomColor();
        div.style.background=color;

        div.onclick=()=>clickBlock(div);

        grid.appendChild(div);
    }
}

function randomColor(){
    return colors[Math.floor(Math.random()*colors.length)];
}

function clickBlock(el){
    if(moves<=0 || lives<=0) return;

    moves--;
    coins+=100;

    el.classList.add("pop");

    setTimeout(()=>{
        el.classList.remove("pop");
        el.style.background=randomColor();
    },300);

    // chance erro
    if(Math.random()<0.15){
        lives--;
    }

    updateHUD();

    if(lives<=0){
        alert("Fim de jogo!");
    }
}

function updateHUD(){
    document.getElementById("moves").innerText = moves;
    document.getElementById("coins").innerText = coins;
    document.getElementById("lives").innerText = "❤️".repeat(lives);
}

function restart(){
    moves=15;
    coins=0;
    lives=3;
    updateHUD();
    init();
}

init();
</script>

</body>
</html>
