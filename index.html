<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NOy Candy ULTRA | LUX Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&display=swap');

        :root {
            --canvas: #03050a;
            --accent: #00f2ff;
            --lv-gold: #ffcc00;
        }

        body {
            background-color: var(--canvas);
            background-image: radial-gradient(circle at 50% -20%, #1a1f35 0%, var(--canvas) 80%);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Cristais com Brilho Ray-Tracing */
        .candy-node {
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        .candy-node::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, transparent 60%);
            z-index: 1;
        }

        .candy-node:active { transform: scale(0.85) rotate(5deg); }

        /* HUD Superior Flutuante */
        .hud-glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.02);
        }

        /* Efeito de Fumaçinha Neon */
        .vfx-smoke {
            position: absolute;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
            width: 20px; height: 20px;
            pointer-events: none;
            z-index: 10;
            animation: smoke-up 0.7s ease-out forwards;
        }

        @keyframes smoke-up {
            0% { transform: scale(0.5); opacity: 1; filter: blur(2px); }
            100% { transform: scale(4) translateY(-50px); opacity: 0; filter: blur(10px); }
        }

        .gold-glow { text-shadow: 0 0 15px rgba(255, 204, 0, 0.5); }
        .heart-glow { filter: drop-shadow(0 0 8px #ff4b4b); }
    </style>
</head>
<body class="safe-area-inset">

    <header class="w-full max-w-md px-4 mt-8 grid grid-cols-12 gap-3">
        <div class="col-span-4 hud-glass p-3 flex flex-col items-center">
            <span class="text-[9px] font-black text-slate-500 uppercase tracking-widest">Moedas</span>
            <span id="coins" class="text-xl font-black text-amber-400 gold-glow">0.0k</span>
        </div>
        <div class="col-span-4 hud-glass p-3 flex flex-col items-center border-b-2 border-cyan-500/50">
            <span class="text-[9px] font-black text-slate-500 uppercase tracking-widest">Moves</span>
            <span id="moves" class="text-2xl font-black italic">15</span>
        </div>
        <div class="col-span-4 hud-glass p-3 flex flex-col items-center">
            <span class="text-[9px] font-black text-slate-500 uppercase tracking-widest">Chances</span>
            <div id="lives" class="flex gap-1 mt-1 text-red-500 text-xs">
                <i class="fas fa-heart heart-glow"></i>
                <i class="fas fa-heart heart-glow"></i>
                <i class="fas fa-heart heart-glow"></i>
            </div>
        </div>
    </header>

    <div class="mt-8">
        <h2 class="text-[10px] font-black tracking-[1em] text-cyan-400 uppercase opacity-70">Noy Candy Lux</h2>
    </div>

    <main class="relative mt-4 p-1 rounded-[32px] bg-gradient-to-b from-cyan-500/20 to-transparent">
        <div id="game-grid" class="grid grid-cols-8 gap-2 p-4 hud-glass" style="width: 90vw; height: 90vw; max-width: 400px; max-height: 400px;">
            </div>
    </main>

    <footer class="mt-auto mb-10 w-full max-w-xs flex justify-around items-center">
        <button class="w-12 h-12 hud-glass flex items-center justify-center text-slate-400 hover:text-white transition-all">
            <i class="fas fa-hammer"></i>
        </button>
        <button onclick="location.reload()" class="w-20 h-20 rounded-full bg-white text-black flex items-center justify-center shadow-[0_0_30px_rgba(255,255,255,0.2)] active:scale-90 transition-all">
            <i class="fas fa-play text-2xl"></i>
        </button>
        <button class="w-12 h-12 hud-glass flex items-center justify-center text-slate-400 hover:text-white transition-all">
            <i class="fas fa-wand-magic-sparkles"></i>
        </button>
    </footer>

    <script>
        const grid = document.getElementById('game-grid');
        const movesEl = document.getElementById('moves');
        const coinsEl = document.getElementById('coins');
        const livesContainer = document.getElementById('lives');

        let moves = 15;
        let coins = 0;
        let lives = 3;
        const width = 8;
        const colors = ['#FF4B4B', '#00D2FF', '#00FF95', '#FFCC00', '#AD00FF'];

        function init() {
            for (let i = 0; i < width * width; i++) {
                const node = document.createElement('div');
                node.className = 'candy-node flex items-center justify-center';
                const color = colors[Math.floor(Math.random() * colors.length)];
                node.style.backgroundColor = color;
                node.style.boxShadow = `inset 0 0 10px ${color}88`;
                
                node.onclick = (e) => handlePop(e, node);
                grid.appendChild(node);
            }
        }

        function handlePop(e, node) {
            if (moves <= 0 || lives <= 0) return;

            // Trigger Fumaçinha
            const rect = node.getBoundingClientRect();
            for(let i=0; i<3; i++) {
                const smoke = document.createElement('div');
                smoke.className = 'vfx-smoke';
                smoke.style.left = `${e.clientX - 10}px`;
                smoke.style.top = `${e.clientY - 10}px`;
                document.body.appendChild(smoke);
                setTimeout(() => smoke.remove(), 700);
            }

            // Game Logic
            moves--;
            coins += 125;
            
            // UI Updates
            movesEl.innerText = moves;
            coinsEl.innerText = (coins / 1000).toFixed(1) + 'k';
            
            // Simulação de chance (10% de chance de erro)
            if (Math.random() < 0.1) {
                lives--;
                updateLives();
            }

            node.style.transform = 'scale(0) rotate(90deg)';
            setTimeout(() => {
                const color = colors[Math.floor(Math.random() * colors.length)];
                node.style.backgroundColor = color;
                node.style.boxShadow = `inset 0 0 10px ${color}88`;
                node.style.transform = 'scale(1) rotate(0deg)';
            }, 300);
        }

        function updateLives() {
            livesContainer.innerHTML = '';
            for(let i=0; i<3; i++) {
                const h = document.createElement('i');
                h.className = i < lives ? 'fas fa-heart heart-glow' : 'far fa-heart opacity-20';
                livesContainer.appendChild(h);
            }
            if(lives === 0) alert("RECARREGUE SUAS CHANCES!");
        }

        init();
    </script>
</body>
</html>
